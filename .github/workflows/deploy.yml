name: Deploy to GitHub Pages

# 트리거: main 브랜치 푸시 + 수동 실행
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub 공식 Pages 배포(artifact 업로드 → 배포)에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 같은 그룹의 이전 배포가 진행 중이면 취소 (중복 배포 방지)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # package.json engines: "^20.19.0 || >=22.12.0" — LTS 22 사용
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` 가 내부적으로 `type-check`(vue-tsc --build) + `build-only`(vite build) 를 병렬 실행
      - name: Type check & Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4