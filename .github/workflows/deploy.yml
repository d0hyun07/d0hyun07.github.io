name: Deploy to GitHub Pages

# 트리거: main 브랜치 푸시 + 수동 실행
on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-pages 브랜치에 푸시할 수 있도록 contents:write 부여
permissions:
  contents: write

# 같은 그룹의 이전 배포가 진행 중이면 취소 (중복 배포 방지)
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # package.json engines: "^20.19.0 || >=22.12.0" — LTS 22 사용
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run build` 가 내부적으로 `type-check`(vue-tsc --build) + `build-only`(vite build) 를 병렬 실행
      - name: Type check & Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
          # 커스텀 도메인 사용 시 주석 해제 후 도메인 입력
          # cname: portfolio.example.com
